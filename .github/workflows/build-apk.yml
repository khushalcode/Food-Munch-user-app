name: Build customer APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Locate Flutter project
        id: find
        run: |
          P=$(find . -name pubspec.yaml -not -path '*/.*' -not -path '*/node_modules/*' | awk '{print length, $0}' | sort -n | head -n1 | cut -d' ' -f2-)
          if [ -z "$P" ]; then
            echo "pubspec.yaml not found. Repo files:"
            git ls-files | head -50
            exit 1
          fi
          echo "dir=$(dirname "$P")" >> "$GITHUB_OUTPUT"
          echo "Found project at: $(dirname "$P")"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.38.x'
          cache: true

      - name: Get dependencies
        run: flutter pub get
        working-directory: ${{ steps.find.outputs.dir }}

      - name: Build APK
        run: flutter build apk --release
        working-directory: ${{ steps.find.outputs.dir }}

      - uses: actions/upload-artifact@v4
        with:
          name: customer-apk
          path: ${{ steps.find.outputs.dir }}/build/app/outputs/flutter-apk/app-release.apk